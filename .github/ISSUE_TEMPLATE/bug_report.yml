name: 问题报告
description: 报告可以复现的错误
body:
  - type: input
    id: environment
    attributes:
      label: 运行环境
      description: Lume 版本、Windows 版本、显示器数量与缩放比例
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 描述操作顺序、期望结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 补充信息
      description: 可在设置页导出脱敏诊断，检查内容后作为附件上传。请注明复现时间，可附去除个人信息的截图；不要上传密钥、真实用户配置、历史导出或文件正文。
